name: Build Windows Installer

on:
  push:
    branches:
      - master
      - ids
  pull_request:

jobs:
  msys2-ucrt64:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw
            mingw-w64-ucrt-x86_64-nsis

      - name: Configure
        run: cmake --preset gcc64 -DVERYSLEEPY_BUILD_NUMBER=${{ github.run_number }}

      - name: Build binaries
        run: cmake --build --preset gcc64 --config Release --parallel

      - name: Build NSIS package
        run: cmake --build --preset gcc64 --config Release --parallel --target package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: verysleepy-installer
          path: build-gcc64/packages/*.exe
          if-no-files-found: error
