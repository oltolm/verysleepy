name: Build Windows Installer

on:
  push:
    branches:
      - master
      - ids
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  msys2-ucrt64:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Determine build number
        id: build_number
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            build_number="${GITHUB_REF_NAME#v}"
            if [[ ! "${build_number}" =~ ^[0-9]+$ ]]; then
              echo "Release tags must match v<number>." >&2
              exit 1
            fi
          else
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw
            mingw-w64-ucrt-x86_64-nsis

      - name: Configure
        run: cmake --preset gcc64 -DVERYSLEEPY_BUILD_NUMBER=${{ steps.build_number.outputs.build_number }}

      - name: Build binaries
        run: cmake --build --preset gcc64 --config Release --parallel

      - name: Build NSIS package
        run: cmake --build --preset gcc64 --config Release --parallel --target package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: verysleepy-installer
          path: build-gcc64/packages/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build-gcc64/packages/*.exe
          fail_on_unmatched_files: true
